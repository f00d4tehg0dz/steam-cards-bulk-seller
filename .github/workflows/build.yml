name: Build extension packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release using the version from manifest.json (tags it if the tag does not exist).'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Package for Chrome / Edge / Firefox
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read manifest version
        id: manifest
        run: |
          version=$(jq -r .version manifest.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Could not read version from manifest.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $version"

      - name: Validate manifest & required files
        run: |
          jq empty manifest.json
          required=(
            manifest.json
            background.js
            content.js
            content.css
            injected.js
            popup.html
            popup.js
            popup.css
            icons/icon16.png
            icons/icon48.png
            icons/icon128.png
          )
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done
          echo "All required files present."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint with web-ext (Firefox-oriented, warnings only)
        continue-on-error: true
        run: |
          npx --yes web-ext@latest lint \
            --source-dir=. \
            --ignore-files "README.md" "CLAUDE.md" "skills-lock.json" "memory/**" ".github/**" "dist/**" "build/**" "*.md" \
            --warnings-as-errors=false || true

      - name: Stage extension sources
        run: |
          mkdir -p build/src
          cp -r \
            manifest.json \
            background.js \
            content.js \
            content.css \
            injected.js \
            popup.html \
            popup.js \
            popup.css \
            icons \
            build/src/
          echo "Staged files:"
          ls -la build/src

      - name: Package Chrome zip
        run: |
          mkdir -p dist
          version="${{ steps.manifest.outputs.version }}"
          out="$GITHUB_WORKSPACE/dist/steam-cards-bulk-seller-chrome-v${version}.zip"
          (cd build/src && zip -qr "$out" .)
          echo "Wrote $out ($(du -h "$out" | cut -f1))"

      - name: Package Edge zip
        run: |
          version="${{ steps.manifest.outputs.version }}"
          out="$GITHUB_WORKSPACE/dist/steam-cards-bulk-seller-edge-v${version}.zip"
          (cd build/src && zip -qr "$out" .)
          echo "Wrote $out ($(du -h "$out" | cut -f1))"

      - name: Package Firefox xpi
        run: |
          version="${{ steps.manifest.outputs.version }}"
          out="$GITHUB_WORKSPACE/dist/steam-cards-bulk-seller-firefox-v${version}.xpi"
          (cd build/src && zip -qr "$out" .)
          echo "Wrote $out ($(du -h "$out" | cut -f1))"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.zip *.xpi > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: List packages
        run: ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages-v${{ steps.manifest.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-packages-v${{ needs.build.outputs.version }}
          path: dist/

      - name: List downloaded artifacts
        run: ls -lh dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # Setting tag_name explicitly lets this job run for BOTH a tag push
          # (tag already exists) and a manual workflow_dispatch (action will
          # create the tag on-the-fly, pointing at whatever commit is checked
          # out for this run).
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          files: |
            dist/*.zip
            dist/*.xpi
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Downloads

            | Browser | File |
            | --- | --- |
            | Chrome | `steam-cards-bulk-seller-chrome-v${{ needs.build.outputs.version }}.zip` |
            | Edge | `steam-cards-bulk-seller-edge-v${{ needs.build.outputs.version }}.zip` |
            | Firefox | `steam-cards-bulk-seller-firefox-v${{ needs.build.outputs.version }}.xpi` |

            SHA-256 checksums: `SHA256SUMS.txt`.

            See the [README](../../blob/main/README.md#install) for install instructions.
